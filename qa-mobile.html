<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>QA mobile</title>
<style>body{margin:0;background:#333;font:12px system-ui}iframe{width:390px;height:844px;border:0;display:block;background:#fff}pre{color:#eee;background:#111;margin:0;padding:8px;white-space:pre-wrap}</style>
</head><body>
<iframe id="f" src="index.html?qa=1"></iframe>
<script>
var f=document.getElementById('f');
f.addEventListener('load', function(){ setTimeout(report, 900); });
function report(){
  var d=f.contentDocument, w=f.contentWindow;
  var vw=w.innerWidth, sw=d.documentElement.scrollWidth, bad=[];
  Array.prototype.forEach.call(d.querySelectorAll('body *'), function(el){
    var r=el.getBoundingClientRect();
    if(r.right > vw + 1.5 || r.width > vw + 1.5){
      bad.push({tag:el.tagName, cls:String(el.className||'').slice(0,40), w:Math.round(r.width), right:Math.round(r.right)});
    }
  });
  var out={vw:vw, scrollWidth:sw, innerHeight:w.innerHeight, docHeight:d.documentElement.scrollHeight, overflowCount:bad.length, items:bad.slice(0,10)};
  var pre=document.createElement('pre'); pre.textContent=JSON.stringify(out,null,2); document.body.appendChild(pre);
  window.__qa = out;
}
</script></body></html>
